name: Terraform CI

on:
  push:
    branches: [ "main", "feature/*" ]

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init
        working-directory: ./phase-2

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./phase-2

      - name: Terraform Plan
        run: terraform plan
        working-directory: ./phase-2
